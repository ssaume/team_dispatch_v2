<!doctype html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
</head>
<body>
<script>
  const ALLOWED_ORIGIN = <?!= JSON.stringify(allowedOrigin) ?>;

  function isAllowed(origin) {
    if (!ALLOWED_ORIGIN) return true; // 僅供初次設定。正式使用務必設定 ALLOWED_ORIGIN。
    return origin === ALLOWED_ORIGIN;
  }

  function announce(origin) {
    try {
      parent.postMessage({channel:'team-dispatch-ready'}, origin || ALLOWED_ORIGIN || '*');
    } catch (_) {}
  }

  window.addEventListener('message', event => {
    const msg = event.data || {};
    if (!isAllowed(event.origin)) return;

    if (msg.channel === 'team-dispatch-ping') {
      announce(event.origin);
      return;
    }
    if (msg.channel !== 'team-dispatch-rpc' || !msg.id) return;

    google.script.run
      .withSuccessHandler(result => {
        event.source.postMessage({
          channel:'team-dispatch-rpc',
          id:msg.id,
          ok:true,
          result
        }, event.origin);
      })
      .withFailureHandler(err => {
        event.source.postMessage({
          channel:'team-dispatch-rpc',
          id:msg.id,
          ok:false,
          error:(err && err.message) ? err.message : String(err)
        }, event.origin);
      })
      .api(JSON.stringify(msg.payload || {}));
  });

  announce(ALLOWED_ORIGIN || '*');
</script>
</body>
</html>
