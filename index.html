<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eaf6fd">
  <title>Team Dispatch</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>

  <template id="loginTpl">
    <main class="login-shell">
      <section class="login-card">
        <div class="brand-mark">✓</div>
        <h1>Team Dispatch</h1>
        <p class="muted">團隊派工與個人工作清單</p>
        <div id="bridgeState" class="bridge-state">正在連線 Google Drive…</div>
        <form id="loginForm">
          <label>帳號<input name="username" autocomplete="username" required></label>
          <label>密碼<input type="password" name="password" autocomplete="current-password" required></label>
          <button class="primary" type="submit" disabled>登入</button>
          <div id="loginError" class="error"></div>
        </form>
      </section>
    </main>
  </template>

  <template id="mainTpl">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">Team Dispatch</div>
        <nav>
          <button data-view="my" class="nav-btn active">我的工作</button>
          <button data-view="request" class="nav-btn">請別人協助</button>
          <button data-view="admin" id="adminNav" class="nav-btn hidden">帳號管理</button>
        </nav>
        <div class="user-box">
          <div id="whoami"></div>
          <button id="logoutBtn" class="ghost">登出</button>
        </div>
      </aside>

      <main class="content">
        <section id="myView" class="view"></section>
        <section id="requestView" class="view hidden"></section>
        <section id="adminView" class="view hidden"></section>
      </main>
    </div>

    <dialog id="taskDialog">
      <form method="dialog" class="dialog-card">
        <div class="dialog-header">
          <h3>工作內容</h3>
          <button value="cancel" class="icon-btn">×</button>
        </div>
        <div id="taskDetail"></div>
      </form>
    </dialog>

    <dialog id="rejectDialog">
      <form id="rejectForm" method="dialog" class="dialog-card">
        <div class="dialog-header">
          <h3>拒絕工作</h3>
          <button value="cancel" class="icon-btn">×</button>
        </div>
        <input type="hidden" name="task_id">
        <label>拒絕理由<textarea name="reason" rows="4" required></textarea></label>
        <div class="dialog-actions">
          <button type="button" id="rejectCancel" class="ghost">取消</button>
          <button type="submit" class="danger">確認拒絕</button>
        </div>
      </form>
    </dialog>
  </template>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
