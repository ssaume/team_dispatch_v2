<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#eaf6fd">
  <title>Team Dispatch</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <div id="app"></div>
  <dialog id="commitOverlay" class="loading-dialog" role="status" aria-live="polite" aria-busy="true">
    <div class="loading-dialog-center">
      <div class="commit-loading-card">
        <div class="loading-spinner" aria-hidden="true"></div>
        <div>
          <strong id="commitLoadingTitle">資料讀取中</strong>
          <div id="commitLoadingText">正在讀取資料，請稍候…</div>
        </div>
      </div>
    </div>
  </dialog>

  <template id="loginTpl">
    <main class="login-shell">
      <section class="login-card">
        <div class="brand-mark">✓</div>
        <h1>Team Dispatch</h1>
        <p class="muted">團隊派工與個人工作清單</p>
        <div id="bridgeState" class="bridge-state">正在連線 Google Drive…</div>
        <form id="loginForm" autocomplete="off">
          <label>帳號<input name="username" autocomplete="off" required></label>
          <label>密碼<input type="password" name="password" autocomplete="off" required></label>
          <button class="primary" id="loginBtn" type="submit" disabled>登入</button>
          <button class="dashboard-entry" id="publicDashboardBtn" type="button" disabled>
            不登入，檢視任務儀表板
          </button>
          <div id="loginError" class="error"></div>
        </form>
        <div class="app-version">v2.11.3</div>
      </section>
    </main>
  </template>


  <template id="dashboardTpl">
    <main class="public-dashboard-shell">
      <header class="public-dashboard-header">
        <div>
          <div class="dashboard-eyebrow">PUBLIC · READ ONLY</div>
          <h1>任務儀表板</h1>
          <p class="muted">免登入檢視目前團隊未結任務，不提供任何修改功能。</p>
        </div>
        <div class="dashboard-header-actions">
          <button class="ghost" id="dashboardRefresh" type="button">重新整理</button>
          <button class="secondary" id="dashboardBackLogin" type="button">返回登入</button>
        </div>
      </header>

      <div id="dashboardState" class="dashboard-state">
        <div class="loading-spinner" aria-hidden="true"></div>
        <span>正在讀取目前任務…</span>
      </div>

      <section id="dashboardContent" class="hidden">
        <div class="dashboard-meta">
          <div>
            <span class="mini">資料更新時間</span>
            <strong id="dashboardGeneratedAt">-</strong>
          </div>
          <div class="dashboard-security-note">
            此頁不需登入，因此僅顯示工作類型與排程資訊，不公開需求內容。
          </div>
        </div>

        <div id="dashboardUpdateNotice" class="dashboard-update-notice hidden">
          <strong>有新的資料更新</strong>
          <span>目前畫面仍保留原內容，請按右上角「重新整理」取得最新資料。</span>
        </div>

        <details class="dashboard-section dashboard-fold" open>
          <summary class="dashboard-section-head">
            <div>
              <h2>近期出差人員</h2>
              <div id="dashboardTripRange" class="muted">未來一個月</div>
            </div>
            <div class="dashboard-summary-right">
              <div id="dashboardTripCount" class="dashboard-count"></div>
              <span class="dashboard-fold-indicator" aria-hidden="true"></span>
            </div>
          </summary>
          <div class="dashboard-fold-body">
            <div id="dashboardRecentTrips"></div>
          </div>
        </details>

        <details class="dashboard-section dashboard-fold" open>
          <summary class="dashboard-section-head">
            <div>
              <h2>休假計畫</h2>
              <div id="dashboardLeaveRange" class="muted"></div>
            </div>
            <div class="dashboard-summary-right">
              <div id="dashboardTodayLeaveCount" class="dashboard-count"></div>
              <span class="dashboard-fold-indicator" aria-hidden="true"></span>
            </div>
          </summary>
          <div class="dashboard-fold-body">
            <div class="dashboard-tabs" role="tablist">
              <button type="button" class="dashboard-tab active" data-leave-tab="today">當日</button>
              <button type="button" class="dashboard-tab" data-leave-tab="future">未來一個月</button>
            </div>
            <div id="dashboardLeaveTodayPanel" class="dashboard-tab-panel">
              <div id="dashboardTodayLeave"></div>
            </div>
            <div id="dashboardLeaveFuturePanel" class="dashboard-tab-panel hidden">
              <div id="dashboardFutureLeaves"></div>
            </div>
          </div>
        </details>

        <details class="dashboard-section dashboard-fold" open>
          <summary class="dashboard-section-head">
            <div>
              <h2>本週執行中任務</h2>
              <div id="dashboardWeekRange" class="muted"></div>
            </div>
            <div class="dashboard-summary-right">
              <div id="dashboardWeekCount" class="dashboard-count"></div>
              <span class="dashboard-fold-indicator" aria-hidden="true"></span>
            </div>
          </summary>
          <div class="dashboard-fold-body">
            <div id="dashboardWeekTasks"></div>
          </div>
        </details>

        <details class="dashboard-section dashboard-fold" open>
          <summary class="dashboard-section-head">
            <div>
              <h2>當週任務中止</h2>
              <div id="dashboardCancelledRange" class="muted"></div>
            </div>
            <div class="dashboard-summary-right">
              <div id="dashboardCancelledCount" class="dashboard-count"></div>
              <span class="dashboard-fold-indicator" aria-hidden="true"></span>
            </div>
          </summary>
          <div class="dashboard-fold-body">
            <div id="dashboardCancelledTasks"></div>
          </div>
        </details>

        <details class="dashboard-section dashboard-fold" open>
          <summary class="dashboard-section-head">
            <div>
              <h2>已派發未來任務</h2>
              <div id="dashboardHorizonRange" class="muted">依需求日期排序</div>
            </div>
            <div class="dashboard-summary-right">
              <div id="dashboardFutureCount" class="dashboard-count"></div>
              <span class="dashboard-fold-indicator" aria-hidden="true"></span>
            </div>
          </summary>
          <div class="dashboard-fold-body">
            <div id="dashboardFutureTasks"></div>
          </div>
        </details>

        <details class="dashboard-section dashboard-fold dashboard-loading-section" open>
          <summary class="dashboard-section-head">
            <div>
              <h2>團隊 Loading 熱力圖</h2>
              <div id="dashboardLoadingRange" class="muted">未來兩週 · 冷色低 Loading，暖色高 Loading</div>
            </div>
            <div class="dashboard-summary-right">
              <div id="dashboardLoadingCount" class="dashboard-count"></div>
              <span class="dashboard-fold-indicator" aria-hidden="true"></span>
            </div>
          </summary>
          <div class="dashboard-fold-body">
            <div class="loading-heatmap-legend">
              <span><i class="heat-swatch heat-cool-low"></i>低</span>
              <span><i class="heat-swatch heat-cool-mid"></i>中</span>
              <span><i class="heat-swatch heat-warm"></i>高</span>
              <span><i class="heat-swatch heat-hot"></i>超載</span>
              <span><i class="heat-swatch heat-leave"></i>整天請假</span>
              <span><i class="heat-swatch heat-holiday"></i>國定假日</span>
              <span><i class="heat-swatch heat-weekend"></i>週末</span>
              <span>「假xh」= 部分請假；「出差」不影響 Loading</span>
            </div>
            <div id="dashboardLoadingHeatmap"></div>
          </div>
        </details>
      </section>
    </main>
  </template>

  <template id="mainTpl">
    <div class="layout">
      <aside class="sidebar">
        <div class="brand">Team Dispatch</div>
        <nav>
          <button data-view="my" class="nav-btn active">我的工作</button>
          <button data-view="request" class="nav-btn">指派任務</button>
          <button data-view="schedule" class="nav-btn">請假／出差</button>
          <button data-view="team" class="nav-btn">團隊出勤</button>
          <button data-view="admin" id="adminNav" class="nav-btn hidden">系統管理</button>
        </nav>
        <div class="sidebar-bottom">
          <div class="user-box">
            <div id="whoami"></div>
            <button id="logoutBtn" class="ghost">登出</button>
          </div>
          <div class="app-version sidebar-version">v2.11.3</div>
        </div>
      </aside>

      <main class="content">
        <section id="myView" class="view"></section>
        <section id="requestView" class="view hidden"></section>
        <section id="scheduleView" class="view hidden"></section>
        <section id="teamView" class="view hidden"></section>
        <section id="adminView" class="view hidden"></section>
      </main>
    </div>



    <dialog id="adminUserWorkDialog" class="wide-dialog">
      <div class="dialog-card admin-user-work-card">
        <div class="dialog-header">
          <div>
            <h3 id="adminUserWorkTitle">人員工作日曆</h3>
            <div id="adminUserWorkSubtitle" class="mini"></div>
          </div>
          <button type="button" id="adminUserWorkClose" class="icon-btn">×</button>
        </div>
        <div id="adminUserWorkBody"></div>
      </div>
    </dialog>

    <dialog id="adminUserTaskDialog">
      <div class="dialog-card">
        <div class="dialog-header">
          <h3>人員工作內容</h3>
          <button type="button" id="adminUserTaskClose" class="icon-btn">×</button>
        </div>
        <div id="adminUserTaskDetail"></div>
      </div>
    </dialog>

    <dialog id="adminTaskDialog">
      <form id="adminTaskForm" class="dialog-card">
        <div class="dialog-header"><h3>調整人員工作內容</h3><button type="button" id="adminTaskClose" class="icon-btn">×</button></div>
        <input type="hidden" name="taskId">
        <div id="adminTaskMeta" class="mini"></div>
        <label>工作類型<input name="workType" required></label>
        <label>需求內容<textarea name="content" rows="7" required></textarea></label>
        <div class="dialog-actions"><button type="button" id="adminTaskCancel" class="ghost">取消</button><button type="submit" class="primary">儲存修改</button></div>
      </form>
    </dialog>

    <dialog id="taskDialog" class="task-detail-dialog">
      <form method="dialog" class="dialog-card task-detail-dialog-card">
        <div class="dialog-header"><h3>工作內容</h3><button value="cancel" class="icon-btn">×</button></div>
        <div id="taskDetail"></div>
      </form>
    </dialog>

    <dialog id="selfTaskDialog">
      <form id="selfTaskForm" class="dialog-card">
        <div class="dialog-header"><h3>新增自己的工作</h3><button type="button" id="selfTaskClose" class="icon-btn">×</button></div>
        <label>工作類型<input name="workType" list="taskTitleOptionsSelf" placeholder="自由輸入或選擇既有名稱" required><datalist id="taskTitleOptionsSelf"></datalist></label>
        <label>需求內容<textarea name="content" rows="5" required></textarea></label>
        <label>需求日期<input type="date" name="requestDate" required></label>
        <label>預估工時（小時）<input type="number" name="plannedHours" min="0.25" max="999" step="0.25" value="8" required></label>
        <label class="check-row"><input type="checkbox" name="isCollaborative" id="selfTaskCollaborative"><span>此任務為共同作業</span></label>
        <div id="selfTaskCollaborativeFields" class="periodic-fields hidden">
          <label>共同作業人員
            <select name="collaboratorIds" id="selfTaskCollaborators" multiple size="5"></select>
          </label>
          <div class="mini">每一位共同作業人員都會負荷完整的預估總工時，工時不會彼此拆分。</div>
        </div>
        <label class="check-row"><input type="checkbox" name="isPeriodic" id="selfTaskPeriodic"><span>此任務為週期工作</span></label>
        <div id="selfTaskPeriodicFields" class="periodic-fields hidden">
          <label>週期間隔
            <select name="periodCadenceWeeks">
              <option value="1" selected>每週一次</option>
              <option value="2">雙週一次</option>
            </select>
          </label>
          <label>週期結束方式
            <select name="periodEndMode" id="periodEndMode">
              <option value="count" selected>指定週期次數</option>
              <option value="date">指定週期結束日</option>
            </select>
          </label>
          <div id="periodCountField">
            <label>週期次數<input type="number" name="periodCount" min="1" max="52" step="1" value="4"></label>
          </div>
          <div id="periodEndDateField" class="hidden">
            <label>週期結束日<input type="date" name="periodSeriesEndDate"></label>
          </div>
          <div class="mini">第一期會從需求日所在週的星期一開始，到需求日為止；後續依每週／雙週向後建立新的獨立週期，每一期都重新平均分配完整預估工時。</div>
        </div>
        <label>是否公開<select name="visibility" required><option value="public" selected>公開</option><option value="private">私人</option></select></label>
        <div class="dialog-actions"><button type="button" id="selfTaskCancel" class="ghost">取消</button><button type="submit" class="primary">建立工作</button></div>
      </form>
    </dialog>




    <dialog id="assignmentNotificationDialog" class="assignment-notification-dialog">
      <div class="dialog-card assignment-notification-card">
        <div class="dialog-header">
          <div>
            <div class="task-detail-eyebrow">NEW ASSIGNMENT</div>
            <h3 id="assignmentNotificationTitle">收到新任務</h3>
          </div>
          <button type="button" id="assignmentNotificationClose" class="icon-btn">×</button>
        </div>
        <div id="assignmentNotificationBody"></div>
        <div class="dialog-actions">
          <button type="button" id="assignmentNotificationGoMy" class="primary">前往我的工作</button>
        </div>
      </div>
    </dialog>


    <dialog id="moveAllocationDialog">
      <form id="moveAllocationForm" class="dialog-card">
        <div class="dialog-header">
          <h3>移動日曆任務</h3>
          <button type="button" id="moveAllocationClose" class="icon-btn">×</button>
        </div>
        <input type="hidden" name="allocationId">
        <div id="moveAllocationSummary" class="split-summary"></div>
        <label>
          目標日期
          <input type="date" name="targetDate" required>
        </label>
        <div id="moveAllocationHint" class="mini">週末、國定假日、請假日與任務有效期間外的日期不可移入。</div>
        <div class="dialog-actions">
          <button type="button" id="moveAllocationCancel" class="ghost">取消</button>
          <button type="submit" class="primary">確認移動</button>
        </div>
      </form>
    </dialog>

    <dialog id="splitAllocationDialog">
      <form id="splitAllocationForm" class="dialog-card">
        <div class="dialog-header">
          <h3>分拆日曆任務</h3>
          <button type="button" id="splitAllocationClose" class="icon-btn">×</button>
        </div>
        <input type="hidden" name="allocationId">
        <div id="splitAllocationSummary" class="split-summary"></div>
        <label>
          移至目標日的比例（%）
          <input type="number" name="movePercent" min="1" max="99" step="1" value="50" required>
        </label>
        <div id="splitAllocationPreview" class="hint-box"></div>
        <label>
          分拆目標日
          <input type="date" name="targetDate" required>
        </label>
        <div id="splitTargetHint" class="mini"></div>
        <div class="dialog-actions">
          <button type="button" id="splitAllocationCancel" class="ghost">取消</button>
          <button type="submit" class="primary">確認分拆</button>
        </div>
      </form>
    </dialog>

    <dialog id="stopTaskDialog">
      <form id="stopTaskForm" class="dialog-card">
        <div class="dialog-header">
          <h3>中止任務</h3>
          <button type="button" id="stopTaskClose" class="icon-btn">×</button>
        </div>
        <input type="hidden" name="taskId">
        <input type="hidden" name="source">
        <div id="stopTaskSummary" class="mini"></div>
        <label>中止理由
          <textarea name="reason" rows="4" required placeholder="請輸入中止原因"></textarea>
        </label>
        <div class="dialog-actions">
          <button type="button" id="stopTaskCancel" class="ghost">取消</button>
          <button type="submit" class="danger">確認中止</button>
        </div>
      </form>
    </dialog>

    <dialog id="rejectDialog">
      <form id="rejectForm" method="dialog" class="dialog-card">
        <div class="dialog-header"><h3>拒絕工作</h3><button value="cancel" class="icon-btn">×</button></div>
        <input type="hidden" name="task_id">
        <label>拒絕理由<textarea name="reason" rows="4" required></textarea></label>
        <div class="dialog-actions"><button type="button" id="rejectCancel" class="ghost">取消</button><button type="submit" class="danger">確認拒絕</button></div>
      </form>
    </dialog>
  </template>

  <script src="./config.js"></script>
  <script src="./app.js"></script>
</body>
</html>
